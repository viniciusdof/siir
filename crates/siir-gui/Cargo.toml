[package]
name = "siir-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Desktop front end for SIIR"
repository = "https://codeberg.org/viniciusdof/siir"
publish = false

[dependencies]
dirs = "7.0.0"
gpui-kit = { version = "=0.10.0", default-features = false, features = ["assets"] }
rust-i18n = "=4.2.4"
serde = { version = "1.0.229", features = ["derive"] }
siir-save = { path = "../siir-save", version = "0.1.0" }
sys-locale = "=0.3.2"
toml = "1.2.1"

[lints]
workspace = true
