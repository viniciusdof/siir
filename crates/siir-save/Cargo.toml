[package]
name = "siir-save"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Typed save model and edits for ETS2 and ATS"
repository = "https://codeberg.org/viniciusdof/siir"
publish = false

[dependencies]
siir = { path = "../siir", version = "0.1.0" }
zip = { version = "9.6.0", default-features = false }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
