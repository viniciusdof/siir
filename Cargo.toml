[package]
name = "siir"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Read, edit, and write SCS Software SII files"
repository = "https://codeberg.org/viniciusdof/siir"
readme = "README.md"
publish = false

[dependencies]
aes = "0.8"
cbc = "0.1"
flate2 = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
