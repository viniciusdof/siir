name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: just ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install GPUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: jdx/mise-action@v5
        with:
          install_args: rust just cargo-deny cargo-binstall cargo:cargo-audit
      - uses: Swatinem/rust-cache@v2
      - run: just ci

  bundle:
    name: bundle (${{ matrix.name }})
    needs: gate
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            recipe: bundle-macos
            files: target/bundle/macos/*.dmg
          - name: windows
            os: windows-latest
            recipe: bundle-windows
            files: target/bundle/windows/*.exe
          - name: linux-x86_64
            os: ubuntu-24.04
            recipe: bundle-linux
            files: target/bundle/linux/*.AppImage
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            recipe: bundle-linux
            files: target/bundle/linux/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install GPUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: jdx/mise-action@v5
        with:
          install_args: rust just
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.recipe }}
      - run: just ${{ matrix.recipe }}
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

